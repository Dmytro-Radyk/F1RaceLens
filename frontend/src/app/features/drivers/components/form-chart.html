<figure class="form-chart">
  <figcaption>
    <h2>Форма за етапами</h2>
    <p>Старт і фактичний фініш. Менше число — вища позиція.</p>
  </figcaption>
  <div class="chart-legend">
    <span class="finish-legend">● Фініш</span><span>┄ Старт</span><span>× Схід / інший статус</span>
  </div>
  <div class="chart-frame" (pointerleave)="hovered.set(null)">
    <div
      class="chart-scroll"
      tabindex="0"
      role="region"
      aria-label="Графік позицій за етапами"
      (scroll)="onChartScroll($event)"
    >
      <div class="chart-canvas">
        <svg viewBox="0 0 800 345" role="img" aria-labelledby="form-title form-description">
          <title id="form-title">Стартові та фінішні позиції за етапами</title>
          <desc id="form-description">
            Повні числові значення наведені у таблиці результатів нижче. Сходи, невідомі значення,
            пропуски та кілька результатів одного етапу розривають лінію.
          </desc>
          @for (tick of chart().ticks; track tick.value) {
            <line x1="55" x2="745" [attr.y1]="tick.y" [attr.y2]="tick.y" class="chart-grid" />
            <text x="38" [attr.y]="tick.y + 4" text-anchor="end">{{ tick.value }}</text>
          }
          <path [attr.d]="chart().start" class="start-line" />
          <path [attr.d]="chart().finish" class="finish-line" />
          @for (point of chart().points; track point.round) {
            @if (point.gridY !== null) {
              <rect
                [attr.x]="point.x - 3"
                [attr.y]="point.gridY - 3"
                width="6"
                height="6"
                class="start-dot"
              ></rect>
            }
            @if (point.finished) {
              <circle [attr.cx]="point.x" [attr.cy]="point.y" r="4" class="finish-dot"></circle>
            } @else {
              <path
                [attr.d]="'M' + (point.x - 4) + ',' + (point.y - 4) + 'l8,8m-8,0l8,-8'"
                class="status-marker"
              ></path>
            }
            <text [attr.x]="point.x" y="315" text-anchor="middle">{{ point.round }}</text>
          }
          <text x="400" y="340" text-anchor="middle">Етап</text>
        </svg>
        @for (marker of markers(); track marker.id) {
          <div
            class="chart-point"
            [class.active]="active() === marker.id"
            [style.left.%]="marker.x / 8"
            [style.top.%]="marker.y / 3.45"
            (pointerenter)="show(marker.id, $event)"
          >
            <button
              class="point-target"
              type="button"
              [attr.aria-label]="marker.label"
              [attr.aria-describedby]="active() === marker.id ? 'chart-point-tooltip' : null"
              (focus)="show(marker.id, $event, true)"
              (blur)="focused.set(null)"
              (click)="show(marker.id, $event, true)"
            ></button>
          </div>
        }
      </div>
    </div>
    @if (selected(); as marker) {
      <div
        class="chart-tooltip"
        role="tooltip"
        id="chart-point-tooltip"
        [style.left.px]="placement().left"
        [style.top.px]="placement().top"
        [style.bottom.px]="placement().bottom"
      >
        <strong>{{ marker.title }}</strong
        ><span>{{ marker.detail }}</span>
      </div>
    }
  </div>
  <p class="chart-help">
    Хрестик під графіком не має числової позиції. Сходи не прирівнюються до останнього місця. Кілька
    історичних записів одного етапу показано лише в таблиці. Наведіть на точку або виберіть її
    клавішею Tab; на телефоні натисніть. Escape закриває підказку. На телефоні графік можна
    прокручувати.
  </p>
</figure>
