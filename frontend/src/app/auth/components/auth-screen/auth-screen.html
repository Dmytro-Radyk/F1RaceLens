<main class="auth-screen">
  <header class="auth-topbar">
    <div class="auth-wordmark">
      <span class="brand-badge" aria-hidden="true">F1</span><span>F1 Race Lens</span>
    </div>
    <button class="auth-theme-toggle" type="button" (click)="theme.toggle()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <use [attr.href]="theme.isDark() ? '#icon-sun' : '#icon-moon'" />
      </svg>
      <span>{{ theme.isDark() ? 'Світла тема' : 'Темна тема' }}</span>
    </button>
  </header>
  <section class="auth-card" aria-labelledby="auth-heading">
    <div class="auth-brand-panel">
      <p class="auth-brand-kicker"><span aria-hidden="true"></span> ФОРМУЛА-1. БЛИЖЧЕ.</p>
      <div class="auth-brand-copy">
        <p class="auth-brand-label">Більше, ніж результати.</p>
        <h2>Кожна гонка.<br />Кожна деталь.<br /><span>Ваш погляд.</span></h2>
        <p class="auth-brand-description">
          Розумійте перегони глибше. Стежте за пілотами, порівнюйте виступи та знаходьте історії за
          цифрами.
        </p>
      </div>
      <svg class="auth-track" aria-hidden="true" viewBox="0 0 540 320" fill="none">
        <path
          d="M78 64H352Q398 64 398 105V130Q398 156 436 156H460Q494 156 494 193V222Q494 262 454 262H219Q185 262 185 229V206Q185 181 159 181H100Q55 181 55 139V99Q55 64 78 64Z"
        />
        <path
          d="M78 80H348Q382 80 382 109V132Q382 172 433 172H458Q478 172 478 195V220Q478 246 452 246H222Q201 246 201 227V206Q201 165 159 165H103Q71 165 71 137V101Q71 80 78 80Z"
        />
      </svg>
      <div class="auth-brand-footer">
        <span>СЕЗОН</span><span>ПІЛОТИ</span><span>АНАЛІТИКА</span>
      </div>
    </div>
    <div class="auth-form-panel">
      @if (mode() === 'login') {
        <app-login-form (registerRequested)="switchTo('register')" />
      } @else {
        <app-register-form (loginRequested)="switchTo('login')" />
      }
    </div>
  </section>
  <p class="auth-page-footer">ВАШІ ПЕРЕГОНИ. ВАШ ПОГЛЯД.</p>
</main>
